name: ci

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Run a single matrix job (or 'all')"
        required: true
        default: "all"
        type: choice
        options: [all, linux-x64, linux-arm64, macos-arm64, macos-x64, windows-x64]
  push:
    branches: [main]
    tags: ["v*"]
    # docs-only pushes do not need the 5-OS matrix (macOS bills 10x);
    # path filters are not evaluated for tag pushes, so releases always build
    paths-ignore: ["durable-memory/**", "**.md"]
  pull_request:
    paths-ignore: ["durable-memory/**", "**.md"]

# Least privilege: build jobs (which run third-party npm install scripts)
# only read; the release job alone gets contents: write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
          - { os: macos-15,         name: macos-arm64 }
          - { os: macos-15-intel,   name: macos-x64 }
          - { os: windows-2022,     name: windows-x64 }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || matrix.name == inputs.only
    defaults:
      run:
        shell: bash # pwsh/zsh would silently skip the sync scripts on some runners
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # no token in .git/config for npm scripts

      - name: sync lexbor (lexbor.lock) and verify vendored sdk header
        run: |
          scripts/sync-lexbor.sh
          scripts/sync-sdk.sh --verify

      - name: toolchain (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: toolchain (macos)
        if: runner.os == 'macOS'
        run: brew install ninja coreutils

      - name: toolchain (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! command -v g++ >/dev/null 2>&1 || ! command -v ninja >/dev/null 2>&1; then
            for i in 1 2 3; do
              choco install -y mingw ninja && break
              echo "choco attempt $i failed; retrying"; sleep 20
            done
          fi
          command -v g++ >/dev/null 2>&1 || { echo "no mingw g++ on PATH"; exit 1; }
          g++ --version | head -1

      - name: lmscript compiler (npm @lmctl-ai/lmctl, DSL v5)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: install and probe the compiler
        shell: bash
        run: |
          npm i -g @lmctl-ai/lmctl@0.2.347
          scripts/select-compiler.sh | tee compiler.txt
          grep -q lmscript compiler.txt || { echo "no v5 compiler available"; exit 1; }

      - name: python3 shim (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p .ci-bin
          printf '#!/usr/bin/env bash\nexec python "$@"\n' > .ci-bin/python3
          chmod +x .ci-bin/python3
          echo "$PWD/.ci-bin" >> "$GITHUB_PATH"

      - name: build and test
        shell: bash
        run: ./test.sh

      - name: package artifact
        shell: bash
        run: |
          mkdir -p dist
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          cp "build/lmhtml$ext" "dist/lmhtml-${{ matrix.name }}$ext"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lmhtml-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: lmhtml-*
          path: dist
          merge-multiple: true

      - name: esbuild-style npm package layout (not published)
        run: scripts/npm-layout.sh dist npm-packages "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-packages
          path: npm-packages/

      - name: attach binaries to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes dist/*
